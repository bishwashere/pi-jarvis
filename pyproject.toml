[project]
name = "pi-jarvis"
version = "0.1.0"
description = "Portable Raspberry Pi voice assistant runtime"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    # Minimum patched TLS trust-store and HTTP streaming dependencies.
    "certifi>=2026.10.19",
    "urllib3>=2.8.0,<3",
    # Keep a manylinux2014 ARM64 wheel available for Python 3.10 Pi installs.
    # The complementary marker lets newer Pythons use current ONNX Runtime.
    "onnxruntime<1.17; python_version<'3.11'",
    "onnxruntime>=1.24,<2; python_version>='3.11'",
    "piper-tts>=1.8.0,<2",
    "sounddevice>=0.5.6,<0.6",
    "vosk>=0.3.45,<0.4",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
